modLoader = "javafml"
loaderVersion = "*"
license = "GNU Lesser General Public License v3.0"

[[mods]]
modId = "paucultimate"
version = "${version}"
displayName = "PauC_Ultimate_de_Ouf"
authors = "Hoyatla"
description = '''
PauC_Ultimate_de_Ouf fuses PauC Shader and PauC Core into a single Forge rendering stack.
'''
provides = ["pauc_core", "pauc_shader"]

[[dependencies.paucultimate]]
modId = "embeddium"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

# Distant Horizons is an external dependency since 0.6.0 (no longer embedded). Optional: without it,
# PauC runs as shader + performance core with the LOD subsystem disabled. Install DH 3.0.x alongside.
[[dependencies.paucultimate]]
modId = "distanthorizons"
mandatory = false
versionRange = "[3.0,4.0)"
ordering = "AFTER"
side = "CLIENT"


[mods."paucultimate:options"]
"mixin.features.render.world.sky" = false
"mixin.features.render.gui.font" = false
